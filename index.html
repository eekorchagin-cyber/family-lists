<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#2a7a4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Покупки" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Покупки</title>
    <script>
      if (location.hostname === '127.0.0.1' && location.port === '5173') {
        location.replace(location.href.replace('127.0.0.1', 'localhost'))
      }
    </script>
    <script>
      try {
        const data = JSON.parse(localStorage.getItem('pokupki-data') || 'null')
        if (data?.settings?.theme) document.documentElement.dataset.theme = data.settings.theme
        if (data?.settings?.fontSize) document.documentElement.dataset.font = data.settings.fontSize
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var host = location.hostname
        if (host === 'localhost' || host === '127.0.0.1') return
        if (sessionStorage.getItem('pokupki-reloaded')) return
        var current = ''
        var scripts = document.getElementsByTagName('script')
        for (var i = 0; i < scripts.length; i++) {
          var src = scripts[i].getAttribute('src') || ''
          if (src.indexOf('assets/index-') !== -1) current = src
        }
        if (!current) return
        fetch('./index.html?t=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            return response.text()
          })
          .then(function (html) {
            var match = html.match(/assets\/index-[^"' ]+\.js/)
            if (!match || current.indexOf(match[0]) !== -1) return
            sessionStorage.setItem('pokupki-reloaded', '1')
            location.reload()
          })
          .catch(function () {})
      })()
    </script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a7a4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Покупки" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Покупки</title>
    <script>
      if (location.hostname === '127.0.0.1' && location.port === '5173') {
        location.replace(location.href.replace('127.0.0.1', 'localhost'))
      }
    </script>
    <script>
      try {
        const data = JSON.parse(localStorage.getItem('pokupki-data') || 'null')
        if (data && data.settings && data.settings.theme) {
          document.documentElement.dataset.theme = data.settings.theme
        }
        if (data && data.settings && data.settings.fontSize) {
          document.documentElement.dataset.font = data.settings.fontSize
        }
      } catch (e) {}
    </script>
    <style>
      #boot-fail {
        display: none;
        box-sizing: border-box;
        min-height: 100dvh;
        margin: 0;
        padding: 32px 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f4f7f5;
        color: #1a2e24;
      }
      #boot-fail h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      #boot-fail p {
        margin: 0 0 20px;
        line-height: 1.45;
        color: #3d5a4c;
      }
      #boot-fail button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 16px;
        font-weight: 600;
        background: #2a7a4f;
        color: #fff;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-t7hLfgHn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CuaRuaOo.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fail">
      <h1>Не удалось загрузить приложение</h1>
      <p>
        На этом iPhone зависла старая копия файлов. Нажмите кнопку — очистим кэш и
        откроем свежую версию.
      </p>
      <button type="button" id="boot-fail-btn">Обновить приложение</button>
    </div>
    <script>
      (function () {
        var host = location.hostname
        var isLocal = host === 'localhost' || host === '127.0.0.1'
        var root = document.getElementById('root')
        var fail = document.getElementById('boot-fail')
        var btn = document.getElementById('boot-fail-btn')
        var recovered = false

        function showFail() {
          if (recovered) return
          if (root && root.childNodes.length > 0) return
          if (fail) fail.style.display = 'block'
        }

        function hardRecover() {
          recovered = true
          try {
            sessionStorage.removeItem('pokupki-reloaded')
            sessionStorage.removeItem('pokupki-force-push')
            sessionStorage.removeItem('pokupki-adopt-cloud')
          } catch (e) {}
          var done = function () {
            var url = new URL(location.href)
            url.searchParams.set('v', String(Date.now()))
            location.replace(url.toString())
          }
          var tasks = []
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister() }))
              }),
            )
          }
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key) }))
              }),
            )
          }
          Promise.all(tasks).then(done).catch(done)
        }

        if (btn) btn.addEventListener('click', hardRecover)

        // Если по ?recover=1 — сразу жёсткое обновление.
        try {
          if (new URLSearchParams(location.search).get('recover') === '1') {
            hardRecover()
            return
          }
        } catch (e) {}

        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') showFail()
        }, true)

        // Белый экран: через 4с root пустой — показываем восстановление.
        window.setTimeout(function () {
          if (!root || root.childNodes.length === 0) showFail()
        }, 4000)

        if (isLocal) return
        if (sessionStorage.getItem('pokupki-reloaded')) return
        var current = ''
        var scripts = document.getElementsByTagName('script')
        for (var i = 0; i < scripts.length; i++) {
          var src = scripts[i].getAttribute('src') || ''
          if (src.indexOf('assets/index-') !== -1) current = src
        }
        if (!current) return
        fetch('./index.html?t=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            return response.text()
          })
          .then(function (html) {
            var match = html.match(/assets\/index-[^"' ]+\.js/)
            if (!match || current.indexOf(match[0]) !== -1) return
            sessionStorage.setItem('pokupki-reloaded', '1')
            location.reload()
          })
          .catch(function () {})
      })()
    </script>
  </body>
</html>
